name: Profile assets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify snapshot, assets, links, and privacy filters
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/generate.py --check
          python3 scripts/validate.py

  refresh:
    if: >-
      github.repository == 'marek-horvath/marek-horvath' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh public metadata and generate SVGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate.py --refresh
      - name: Validate generated output
        run: |
          python3 scripts/generate.py --check
          python3 scripts/validate.py
      - name: Commit only generated public assets
        run: |
          git add -- assets/*.svg data/activity.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public repository activity [skip ci]'
          git push origin HEAD:main
